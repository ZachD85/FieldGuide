<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Literature & Resource Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Smooth transition for mobile drawer */
        .sidebar-transition { transition: transform 0.3s ease-in-out; }

        /* Smooth fading placeholder transitions */
        #copilotQueryInput::placeholder {
            transition: opacity 0.5s ease-in-out;
            opacity: 1;
        }
        #copilotQueryInput.placeholder-fade-out::placeholder {
            opacity: 0;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <header class="bg-[#00205B] text-white px-4 py-3 flex items-center justify-between shadow-md z-30 shrink-0">
        <div class="flex items-center space-x-3">
            <button id="mobileMenuBtn" class="md:hidden text-white hover:text-orange-400 focus:outline-none transition-colors">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="flex items-baseline space-x-1 cursor-pointer" onclick="navigateToHome()">
                <span class="text-xl font-bold tracking-tight">Atri<span class="text-[#FF6B00]">Guide</span></span>
                <span class="text-xs text-slate-300 ml-2 hidden sm:inline font-semibold tracking-wider uppercase">FIELD REFERENCE</span>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <button onclick="navigateToHome()" class="p-1.5 text-slate-300 hover:text-orange-400 transition-colors focus:outline-none cursor-pointer flex items-center justify-center" title="Go to Home Guide">
                <i data-lucide="home" class="w-5 h-5"></i>
            </button>

            <button id="starredQuickBtn" onclick="toggleStarredFilter()" class="relative p-1.5 text-slate-300 hover:text-orange-400 transition-colors focus:outline-none cursor-pointer" title="Starred Resources">
                <i data-lucide="star" class="w-5 h-5"></i>
                <span id="starBadgeCount" class="absolute -top-1 -right-1 bg-orange-500 text-white text-[9px] font-bold h-4 w-4 rounded-full flex items-center justify-center hidden">0</span>
            </button>
            
            <button id="adminPortalBtn" class="text-xs font-semibold text-slate-300 hover:text-orange-400 border border-slate-400/30 hover:border-orange-400/50 px-2.5 py-1.5 rounded transition-all flex items-center space-x-1 bg-white/5 cursor-pointer">
                <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                <span>Admin Portal</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">

        <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 z-10 hidden md:hidden transition-opacity duration-300 opacity-0"></div>

        <aside id="sidebarMenu" class="fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 w-64 bg-white border-r border-slate-200 z-20 flex flex-col justify-between sidebar-transition md:transition-none h-full shadow-lg md:shadow-none">
            <div class="overflow-y-auto p-4 space-y-4 flex-1">
                <button onclick="navigateToHome()" id="homeGuideBtn" class="w-full flex items-center space-x-2.5 p-3 rounded-lg border border-orange-100 hover:bg-slate-50 hover:text-[#00205B] font-semibold text-sm transition-all shadow-sm">
                    <i data-lucide="home" class="w-4 h-4 text-orange-500"></i>
                    <span>App Home Guide</span>
                </button>

                <div class="text-xs font-bold text-slate-400 tracking-wider uppercase pt-2 mb-1">Resource Hub</div>
                
                <nav class="space-y-2" id="navCategories">
                    <div class="border border-slate-100 rounded-lg overflow-hidden bg-slate-50/50">
                        <button class="w-full flex items-center justify-between p-3 font-semibold text-slate-700 hover:bg-slate-100 hover:text-[#00205B] transition-colors group cursor-pointer" onclick="toggleCategory('mazeMenu')">
                            <div class="flex items-center space-x-2.5">
                                <i data-lucide="activity" class="w-4 h-4 text-[#FF6B00]"></i>
                                <span>MAZE Topics</span>
                            </div>
                            <i data-lucide="chevron-down" id="mazeMenuArrow" class="w-4 h-4 text-slate-400 transition-transform duration-200 transform"></i>
                        </button>
                        <div id="mazeMenu" class="hidden bg-white border-t border-slate-100/80 px-2 py-1.5 space-y-0.5">
                            <button onclick="selectSubCategory('MAZE', 'Rhythm Outcomes')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="MAZE-Rhythm Outcomes">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="heart" class="w-4 h-4 text-slate-500"></i>
                                    <span>Rhythm Outcomes</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-maze-rhythm">0</span>
                            </button>
                            <button onclick="selectSubCategory('MAZE', 'Survival Benefits')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="MAZE-Survival Benefits">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="git-commit" class="w-4 h-4 text-slate-500"></i>
                                    <span>Survival Benefits</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-maze-survival">0</span>
                            </button>
                            <button onclick="selectSubCategory('MAZE', 'Other')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="MAZE-Other">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="help-circle" class="w-4 h-4 text-slate-500"></i>
                                    <span>Other</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-maze-other">0</span>
                            </button>
                        </div>
                    </div>

                    <div class="border border-slate-100 rounded-lg overflow-hidden bg-slate-50/50">
                        <button class="w-full flex items-center justify-between p-3 font-semibold text-slate-700 hover:bg-slate-100 hover:text-[#00205B] transition-colors group cursor-pointer" onclick="toggleCategory('laaMenu')">
                            <div class="flex items-center space-x-2.5">
                                <i data-lucide="heart" class="w-4 h-4 text-[#FF6B00]"></i>
                                <span>LAA Topics</span>
                            </div>
                            <i data-lucide="chevron-down" id="laaMenuArrow" class="w-4 h-4 text-slate-400 transition-transform duration-200 transform"></i>
                        </button>
                        <div id="laaMenu" class="hidden bg-white border-t border-slate-100/80 px-2 py-1.5 space-y-0.5">
                            <button onclick="selectSubCategory('LAA', 'Outcomes and Safety')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="LAA-Outcomes and Safety">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="heart-pulse" class="w-4 h-4 text-slate-500"></i>
                                    <span>Outcomes and Safety</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-laa-outcomes">0</span>
                            </button>
                            <button onclick="selectSubCategory('LAA', 'Stroke Reduction')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="LAA-Stroke Reduction">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="trending-down" class="w-4 h-4 text-slate-500"></i>
                                    <span>Stroke Reduction</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-laa-stroke">0</span>
                            </button>
                            <button onclick="selectSubCategory('LAA', 'Prophylactic Data')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="LAA-Prophylactic Data">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="shield-alert" class="w-4 h-4 text-slate-500"></i>
                                    <span>Prophylactic Data</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-laa-prophylactic">0</span>
                            </button>
                        </div>
                    </div>

                    <div class="border border-slate-100 rounded-lg overflow-hidden bg-slate-50/50">
                        <button class="w-full flex items-center justify-between p-3 font-semibold text-slate-700 hover:bg-slate-100 hover:text-[#00205B] transition-colors group cursor-pointer" onclick="toggleCategory('deviceResourcesMenu')">
                            <div class="flex items-center space-x-2.5">
                                <i data-lucide="wrench" class="w-4 h-4 text-[#FF6B00]"></i>
                                <span>Device Resources</span>
                            </div>
                            <i data-lucide="chevron-down" id="deviceResourcesMenuArrow" class="w-4 h-4 text-slate-400 transition-transform duration-200 transform"></i>
                        </button>
                        <div id="deviceResourcesMenu" class="hidden bg-white border-t border-slate-100/80 px-2 py-1.5 space-y-0.5">
                            <button onclick="selectSubCategory('Device Resources', 'IFUs')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="Device Resources-IFUs">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="file-text" class="w-4 h-4 text-slate-500"></i>
                                    <span>IFUs</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-dev-ifus">0</span>
                            </button>
                            <button onclick="selectSubCategory('Device Resources', 'Product Brochures')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="Device Resources-Product Brochures">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="book-open" class="w-4 h-4 text-slate-500"></i>
                                    <span>Product Brochures</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-dev-brochures">0</span>
                            </button>
                            <button onclick="selectSubCategory('Device Resources', 'Other Media')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-[#00205B] hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="Device Resources-Other Media">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="video" class="w-4 h-4 text-slate-500"></i>
                                    <span>Other Media</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-dev-media">0</span>
                            </button>
                        </div>
                    </div>

                    <div class="border border-slate-100 rounded-lg overflow-hidden bg-slate-50/50">
                        <button class="w-full flex items-center justify-between p-3 font-semibold text-[#00205B] hover:bg-slate-100 hover:text-[#00205B] transition-colors group cursor-pointer" onclick="toggleCategory('miscMenu')">
                            <div class="flex items-center space-x-2.5">
                                <i data-lucide="folder" class="w-4 h-4 text-[#FF6B00]"></i>
                                <span>MISC Resources</span>
                            </div>
                            <i data-lucide="chevron-down" id="miscMenuArrow" class="w-4 h-4 text-slate-400 transition-transform duration-200 transform"></i>
                        </button>
                        <div id="miscMenu" class="hidden bg-white border-t border-slate-100/80 px-2 py-1.5 space-y-0.5">
                            <button onclick="selectSubCategory('MISC', 'Other Research')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="MISC-Other Research">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="microscope" class="w-4 h-4 text-slate-500"></i>
                                    <span>Other Research</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-misc-research">0</span>
                            </button>
                            <button onclick="selectSubCategory('MISC', 'Helpful Documents')" class="w-full text-left px-3 py-2 text-sm rounded font-medium text-slate-600 hover:bg-slate-50 hover:text-[#00205B] flex items-center justify-between subcat-btn" data-subcat="MISC-Helpful Documents">
                                <span class="flex items-center gap-2">
                                    <i data-lucide="file-text" class="w-4 h-4 text-slate-500"></i>
                                    <span>Helpful Documents</span>
                                </span>
                                <span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded-full font-bold" id="count-misc-helpful">0</span>
                            </button>
                        </div>
                    </div>
                </nav>
            </div>
            
            <div class="p-3 border-t border-slate-100 bg-slate-50 flex flex-col space-y-1 text-[11px] text-slate-500">
                <div class="flex items-center justify-between">
                    <span>Database Connection:</span>
                    <span id="syncStatus" class="font-semibold text-emerald-600 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                        <span>Cloud Synced</span>
                    </span>
                </div>
                <div class="flex items-center justify-between text-[10px] text-slate-400">
                    <span>AI Engine Status:</span>
                    <span class="text-[#FF6B00] font-semibold flex items-center gap-1">
                        <i data-lucide="sparkles" class="w-2.5 h-2.5 text-[#FF6B00]"></i>
                        <span>Gemini 2.5 Active</span>
                    </span>
                </div>
            </div>
        </aside>

        <main class="flex-grow bg-slate-50 flex flex-col overflow-hidden">
            <div id="contextHeader" class="bg-white border-b border-slate-200 p-4 shrink-0 flex flex-wrap items-center justify-between gap-3 z-10">
                <div class="flex items-center space-x-2">
                    <button onclick="navigateToHome()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-orange-500 transition-all cursor-pointer flex items-center justify-center mr-1" title="Go to Home Guide">
                        <i data-lucide="home" class="w-4.5 h-4.5"></i>
                    </button>
                    <span id="breadcrumbMain" class="text-lg font-bold text-[#00205B]">Home</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                    <span id="breadcrumbSub" class="text-sm font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md">App Guide</span>
                </div>

                <div id="categorySearchContainer" class="hidden relative w-full sm:w-72">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="categorySearchInput" placeholder="Search within this category..." class="w-full bg-slate-50 text-slate-900 placeholder-slate-400 pl-9 pr-8 py-1.5 rounded-md text-sm border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all animate-fade-in">
                    <button id="clearCategorySearchBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center hidden text-slate-400 hover:text-slate-600">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                
                <div class="flex items-center space-x-3">
                    <div id="starredFilterIndicator" class="hidden bg-amber-50 text-amber-800 border border-amber-200 px-3 py-1 rounded-md text-xs font-semibold items-center space-x-2">
                        <i data-lucide="star" class="w-3.5 h-3.5 text-amber-500 fill-amber-400"></i>
                        <span>Showing Starred Resources</span>
                        <button onclick="toggleStarredFilter()" class="hover:text-amber-950 underline ml-1 font-bold">Show All</button>
                    </div>
                </div>
